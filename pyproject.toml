[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovufet-sim"
version = "0.1.0"
description = "Ovulation FET simulator (journal package)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "openpyxl>=3.1",
]

[project.scripts]
ovufet-sim = "ovufet_sim.cli:main"

[tool.setuptools]
packages = ["ovufet_sim", "fertilai", "fertilai.algorithms", "fertilai.algorithms.shared", "fertilai.algorithms.shared.natural_cycle", "fertilai.interfaces", "fertilai.interfaces.lambdas", "fertilai.treatments", "fertilai.treatments.fet"]
